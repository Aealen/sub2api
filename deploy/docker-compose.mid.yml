# =============================================================================
# Sub2API 中间件专用 Compose（本地裸跑后端时使用）
# =============================================================================
# 只启动 PostgreSQL + Redis，端口绑定 127.0.0.1 供宿主机 go run 直连。
# 后端在 backend/ 下裸跑：go run ./cmd/server
#
# Usage:
#   docker compose -f docker-compose.mid.yml up -d
#   docker compose -f docker-compose.mid.yml logs -f
#   docker compose -f docker-compose.mid.yml down
# =============================================================================
services:
  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres-mid
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=sub2api
      - POSTGRES_PASSWORD=sub2api
      - POSTGRES_DB=sub2api
      - PGDATA=/var/lib/postgresql/data
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis-mid
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ./redis_data:/data
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
